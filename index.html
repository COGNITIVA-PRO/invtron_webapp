else{const id=cur.id||push(ref(db,n)).key;
b[n+"/"+id]={...v,[n+"_ID"]:id};

// === Import (names instead of IDs; adds records, never overwrites) ===
const fm=(k,o)=>t(k).replace(/\{(\w)\}/g,(_,c)=>o[c]??"");
const nk=(n,x)=>n==="Item"?String(x["Part No"]||"").trim().toLowerCase():n==="Subcategory"?x.Category_ID+"|"+String(x.Subcategory_name||"").trim().toLowerCase():String(x[n+"_name"]||"").trim().toLowerCase();
function parseCSV(txt){txt=txt.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
const f1=txt.split("\n")[0]||"",d=f1.split(";").length>f1.split(",").length?";":",";
const rows=[],meta=[];let r=[],f="",st=0,bad=false,line=1,rl=1;
// st: 0 = unquoted/start of field, 1 = inside quotes, 2 = after the closing quote
const endRow=()=>{r.push(f);f="";rows.push(r);meta.push({l:rl,b:bad});r=[];bad=false;st=0;rl=line};
for(let i=0;i<txt.length;i++){const c=txt[i];
if(st===1){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else st=2}else{f+=c;if(c==="\n")line++}continue}
if(c===d){r.push(f);f="";st=0;continue}
if(c==="\n"){line++;endRow();continue}
if(c==='"'){if(st===0&&f.trim()===""){f="";st=1}else{bad=true;f+=c}continue}
if(st===2){if(c!==" "&&c!=="\t"){bad=true;f+=c}continue}
f+=c}
if(st===1)bad=true;
if(f!==""||r.length||st===1)endRow();
const hm=meta.shift(),h=(rows.shift()||[]).map(x=>x.trim());
if(hm&&hm.b)throw 0;
const out=[];rows.forEach((x,i)=>{if(!x.some(v=>v.trim()!==""))return;
const o=Object.fromEntries(h.map((k,j)=>[k,x[j]??""]));
Object.defineProperty(o,"_q",{value:meta[i]});out.push(o)});
return out}
const jsonRows=txt=>{const j=JSON.parse(txt.replace(/^\uFEFF/,"")),a=Array.isArray(j)?j:j&&typeof j==="object"?Object.values(j):null;
if(!a||a.some(x=>!x||typeof x!=="object"))throw 0;return a};
function build(n,rows,off){const ok=[],bad=[],seen=new Set(),have=new Set(col(n).map(x=>nk(n,x)));
rows.forEach((o,i)=>{const ln=o._q?o._q.l:i+off;if(o._q?.b){bad.push(t("rLn")+" "+ln+": "+t("rQuote"));return}
const g=k=>o[k]==null?"":String(o[k]).trim(),r={};let err=null;
for(const [k,y,q] of S[n]){let v="";
if(y==="r"){const c=k.replace("_ID",""),w=g(c+"_name");
if(w){let m=col(c).filter(x=>String(x[c+"_name"]).trim().toLowerCase()===w.toLowerCase());
if(c==="Subcategory"&&r.Category_ID)m=m.filter(x=>x.Category_ID===r.Category_ID);
v=m[0]?.[k]||"";if(!v){err=fm("rRef",{f:lab(k),v:w});break}}
else if(g(k)){v=D[c].has(g(k))?g(k):"";if(!v){err=fm("rRef",{f:lab(k),v:g(k)});break}}}
else{v=g(k);
if(y==="e"&&v&&!E[k].includes(v)){err=fm("rEnum",{f:lab(k),v});break}
if(y==="u"&&v&&!/^https?:\/\/\S+$/i.test(v)){err=fm("rUrl",{f:lab(k)});break}
const mx=k==="Part No"?20:/name$/.test(k)?128:10;
if(y==="s"&&v.length>mx){err=fm("rLen",{f:lab(k),m:mx});break}}
if(q&&!v){err=fm("rReq",{f:lab(k)});break}
r[k]=v}
if(!err){const kk=nk(n,r);if(have.has(kk)||seen.has(kk))err=t("rDup");else seen.add(kk)}
err?bad.push(t("rLn")+" "+ln+": "+err):ok.push(r)});
return{ok,bad}}
function imp(){
const IM=["Class","Category","Subcategory","Location","Item"];
app.innerHTML=`<h2 class="cn">${esc(t("Import"))}</h2><label>${esc(t("imcol"))}<select id="ims">${IM.map(n=>`<option value="${n}">${esc(t(n))}</option>`).join("")}</select></label><p class="mut" id="imh"></p><div class="xb"><button id="imj">${esc(t("imj"))}</button><button id="imc">${esc(t("imc"))}</button></div><input type="file" id="imf" hidden>`;
const hint=()=>{$("#imh").textContent=t("imcols")+": "+S[$("#ims").value].map(([k,y,q])=>(y==="r"?k.replace("_ID","")+"_name":k)+(q?"*":"")).join(", ")};
hint();$("#ims").onchange=hint;
let fmt;const fl=$("#imf");
[["#imj","json",".json,application/json"],["#imc","csv",".csv,text/csv"]].forEach(([id,f,acc])=>$(id).onclick=()=>{fmt=f;fl.accept=acc;fl.value="";fl.click()});
fl.onchange=async()=>{const file=fl.files[0];if(!file)return;let rows=null;
try{const txt=await file.text();rows=fmt==="json"?jsonRows(txt):parseCSV(txt)}catch(e){}
if(!rows||!rows.length)return modal(t("imbad"));
const n=$("#ims").value,{ok,bad}=build(n,rows,fmt==="json"?1:2);
const msg=fm("imres",{n:ok.length,m:bad.length})+(bad.length?"\n"+bad.slice(0,8).join("\n")+(bad.length>8?"\n…":""):"");
if(!ok.length)return modal(msg);
if(!await modal(msg+"\n\n"+t("imgo"),{ask:1}))return;
const b={};ok.forEach(r=>{const id=push(ref(db,n)).key;b[n+"/"+id]={...r,[n+"_ID"]:id};if(n==="Item")bump(b,id,0)});
if(await commit(b))modal(fm("imdone",{n:ok.length}))}}

// === Export (one file per selected collection) ===
const dlf=(name,txt,type)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const csv=n=>{const r=col(n),h=[n+"_ID"];r.forEach(x=>Object.keys(x).forEach(k=>h.includes(k)||h.push(k)));
const q=v=>{v=v==null?"":String(v);return /[",;\r\n]|^\s|\s$/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
return "\uFEFF"+[h.map(q).join(","),...r.map(x=>h.map(k=>q(x[k])).join(","))].join("\r\n")};
function exp(){

$("#xl").onchange=()=>bs.forEach(b=>b.disabled=!$("#xl input:checked"));
$("#xj").onclick=()=>run2("json");$("#xc").onclick=()=>run2("csv")}
